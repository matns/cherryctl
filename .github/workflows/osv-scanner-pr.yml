name: "Scan: Pull Requests (OSV-Scanner)"

on:
  pull_request:
    branches: ["master"]

permissions:
  actions: "read"
  security-events: "write"
  contents: "read"

jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6ad84ce1ef2d4124ba333b221894c133c4a970ea" # v2.7.0
