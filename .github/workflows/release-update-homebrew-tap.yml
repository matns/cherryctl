
name: "Release: Update Homebrew formula"

on:
  release:
    types: [
      "published"
    ]

permissions:
  contents: "read"

concurrency:
  group: "update-homebrew"
  cancel-in-progress: false

jobs:
  update-homebrew:
    if: "${{ !github.event.release.prerelease && !github.event.release.draft }}"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Download Release Checksums"
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          mkdir -p dist

          gh release download "$RELEASE_TAG" \
            --repo cherryservers/cherryctl \
            --pattern "cherryctl-${RELEASE_TAG}.sha256sum" \
            --dir dist

      - name: "Generate Homebrew formula"
        shell: "bash"
        env:
          RELEASE_TAG: "${{ github.event.release.tag_name }}"
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          CHECKSUM_FILE="dist/cherryctl-${TAG}.sha256sum"

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $TAG" >&2
            exit 1
          }

          checksum() {
            awk -v file="$1" '$2 == file { print $1; exit }' "$CHECKSUM_FILE"
          }

          DARWIN_AMD64=$(checksum "cherryctl-${TAG}-darwin-amd64.tar.gz")
          DARWIN_ARM64=$(checksum "cherryctl-${TAG}-darwin-arm64.tar.gz")
          LINUX_AMD64=$(checksum "cherryctl-${TAG}-linux-amd64-gnu.tar.gz")
          LINUX_ARM64=$(checksum "cherryctl-${TAG}-linux-arm64-static.tar.gz")

          cat > cherryctl.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file is automatically generated. DO NOT EDIT.
          class Cherryctl < Formula
            desc "Official Cherry Servers CLI"
            homepage "https://www.cherryservers.com/"
            version "${VERSION}"
            license "MPL-2.0"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/matns/cherryctl/releases/download/${TAG}/cherryctl-${TAG}-darwin-amd64.tar.gz"
                sha256 "${DARWIN_AMD64}"
              end

              if Hardware::CPU.arm?
                url "https://github.com/matns/cherryctl/releases/download/${TAG}/cherryctl-${TAG}-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM64}"
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "https://github.com/matns/cherryctl/releases/download/${TAG}/cherryctl-${TAG}-linux-amd64-gnu.tar.gz"
                sha256 "${LINUX_AMD64}"
              end

              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/matns/cherryctl/releases/download/${TAG}/cherryctl-${TAG}-linux-arm64-static.tar.gz"
                sha256 "${LINUX_ARM64}"
              end
            end

            def install
              bin.install "cherryctl"

              doc.install "LICENSE.md"
              doc.install "SHA256SUMS"
              doc.install "THIRD_PARTY_LICENSES.txt"
            end

            test do
              system "#{bin}/cherryctl", "-v"
            end
          end
          EOF

          ruby -c cherryctl.rb
          cat cherryctl.rb

      - name: "Generate GitHub App token"
        id: "app-token"
        uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510" # v3.3.0
        with:
          client-id: "${{ secrets.CHERRYCTL_TAP_UPDATER_APP_CLIENT_ID }}"
          private-key: "${{ secrets.CHERRYCTL_TAP_UPDATER_APP_PRIVATE_KEY }}"
          owner: "matns"
          repositories: "homebrew-cherryctl"
          permission-contents: "write"

      - name: "Update Homebrew Repository"
        shell: "bash"
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          TARGET_REPO: "matns/homebrew-cherrryctl"
          TARGET_FILE: "Formula/cherryctl.rb"
          RELEASE_TAG: "${{ github.event.release.tag_name }}"
        run: |
          set -euo pipefail

          SHA=$(gh api \
            "repos/$TARGET_REPO/contents/$TARGET_FILE" \
            --jq '.sha')

          CONTENT=$(base64 -w0 cherryctl.rb)

          gh api \
            --method PUT \
            "repos/$TARGET_REPO/contents/$TARGET_FILE" \
            -f message="chore: update cherryctl to $RELEASE_TAG" \
            -f content="$CONTENT" \
            -f sha="$SHA"
