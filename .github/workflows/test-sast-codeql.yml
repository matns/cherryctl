---
name: "Run: CodeQL"
on:
  push:
  pull_request:
permissions: {}
jobs:
  test-with-codeql:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      security-events: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"
      - name: "Init CodeQL"
        uses: "github/codeql-action/init@v4.39.1"
        with:
          languages: "go"
          queries: "security-extended"
      - name: "Analyze"
        uses: "github/codeql-action/analyze@v4.39.1"
        with:
          upload: "always"

