---
name: release
on:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+"
concurrency:
  group: release
  cancel-in-progress: false
  queue: max
permissions: {}
jobs:
  compile-third-party-licenses:
    permissions:
      contents: "read"
    uses: "$/.github/workflows/release-compile-third-party-licenses.yml"

  compile-release-notes:
    name: "Compile: Release Notes"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/release-compile-notes.yml"

  compile-packages:
    name: "Compile: Release Packages (tarballs)"
    needs: "compile-third-party-licenses"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/release-compile-packages.yml"
    with:
      artifact_id_third_party_licenses: "${{ needs.compile-third-party-licenses.outputs.artifact_id_third_party_licenses }}"

  publish-release:
    name: "Publish: Release"
    if: "github.ref_type == 'tag'"
    runs-on: "ubuntu-latest"
    needs: ["compile-packages", "compile-release-notes"]
    permissions:
      contents: "write"
      id-token: "write"
      attestations: "write"
      artifact-metadata: "write"
    outputs:
      release_asset_id_checksums_file: "${{ steps.output-checksums-asset-id.outputs.release_asset_id_checksums_file }}"
    env:
      GITHUB_REF_NAME: "${{ github.ref_name }}"
      SOURCE_NAME: "${{ github.event.repository.name }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0

      - name: "Prepare"
        id: "prepare"
        shell: "bash"
        run: |
          DIST_DIR="$(mktemp -d)"
          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"

          FILENAME_CHECKSUMS="${{ github.event.repository.name }}-${{ github.ref_name }}.sha256sum"
          echo "filename_checksums=${FILENAME_CHECKSUMS}" >> "$GITHUB_OUTPUT"

      - name: "Fetch worklow package artifacts"
        uses: "actions/download-artifact@v8.0.2"
        with:
          pattern: "release-tarballs-${{ github.ref_name }}-*" # fetch all targets
          path: "${{ steps.prepare.outputs.dist_dir }}"
          merge-multiple: true

      - name: "Validate release notes artifact ID"
        shell: bash
        env:
          ARTIFACT_ID: "${{ needs.compile-release-notes.outputs.artifact_id_release_notes }}"
        run: |-
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "::error::Release notes artifact ID is missing"
            exit 1
          fi

      - name: "Fetch release notes"
        id: "fetch-release-notes"
        uses: "actions/download-artifact@v8.0.2"
        with:
          artifact-ids: "${{ needs.compile-release-notes.outputs.artifact_id_release_notes }}"
          path: "${{ github.workspace }}"

      - name: "Set up anchore/syft" # v1.54.1
        shell: "bash"
        run: |
          go install github.com/anchore/syft/cmd/syft@b254e6d92f28c3868a755f62fb3ca8f26e9fee76

      - name: "Generate repository source SBOM"
        shell: "bash"
        env:
          SOURCE_SBOM_NAME: "${{ env.SOURCE_NAME }}-${{ env.GITHUB_REF_NAME }}-source"
          DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
        run: |
          $(go env GOPATH)/bin/syft dir:${{ github.workspace }} \
            --source-name "$SOURCE_NAME" \
            --source-version "$GITHUB_REF_NAME" \
            -o spdx-json="$DIST_DIR/$SOURCE_SBOM_NAME.spdx.json"

          $(go env GOPATH)/bin/syft dir:${{ github.workspace }} \
          --source-name "$SOURCE_NAME" \
          --source-version "$GITHUB_REF_NAME" \
          -o cyclonedx-json="$DIST_DIR/$SOURCE_SBOM_NAME.cdx.json"

      - name: "Generate checksums of the release"
        shell: "bash"
        working-directory: "${{ steps.prepare.outputs.dist_dir }}"
        env:
          CHECKSUMS_FILE: "${{ steps.prepare.outputs.filename_checksums }}"
        run: |
          sha256sum -- * > $CHECKSUMS_FILE

      - name: "Generate build provenance attestation"
        id: "attest"
        uses: "actions/attest@v4.1.0"
        with:
          subject-checksums: "${{ steps.prepare.outputs.dist_dir }}/${{ steps.prepare.outputs.filename_checksums }}"
          show-summary: true

      - name: Set up sigstore/cosign-installer
        uses: sigstore/cosign-installer@v4.1.2

      - name: "Sign checksums with sigstore"
        shell: "bash"
        env:
          DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
          CHECKSUMS_FILE: "${{ steps.prepare.outputs.filename_checksums }}"
        run: |
          cosign sign-blob "$DIST_DIR/$CHECKSUMS_FILE" --bundle "$DIST_DIR/$CHECKSUMS_FILE.sigstore.json" --yes

      - name: "Create release"
        shell: "bash"
        env:
          GH_TOKEN: "${{ github.token }}"
          DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
        run: |
          gh release create "$GITHUB_REF_NAME" "$DIST_DIR/*" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ github.workspace }}/${{ needs.compile-release-notes.outputs.filename_release_notes }}" \
            --verify-tag


      - name: "Get checksums asset ID and output"
        id: "output-checksums-asset-id"
        shell: "bash"
        env:
          GH_TOKEN: "${{ github.token }}"
          CHECKSUMS_FILE: "${{ steps.prepare.outputs.filename_checksums }}"
        run: |
          set -euo pipefail

          asset_id=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" |
              jq -r --arg filename "$CHECKSUMS_FILE" \
                '.assets[] | select(.name == $filename) | .id'
          )

          if [[ -z "$asset_id" ]]; then
            echo "::error title=Release asset not found::Checksum release asset not found: $CHECKSUMS_FILE"
            exit 1
          fi

          echo "::notice title=Release Asset::Checksums asset ID: ${asset_id}"
          echo "release_asset_id_checksums_file=${asset_id}" >> "$GITHUB_OUTPUT"

  update-homebrew-tap:
    name: "Deploy: Homebrew Tap"
    runs-on: "ubuntu-latest"
    needs: ["publish-release"]
    permissions:
      contents: "read"
    environment: "publish-homebrew-formula"
    steps:
      - name: "Checkout repository for local action"
        uses: "actions/checkout@v7.0.1"
      - name: "Update Homebrew Tap"
        uses: "$/.github/actions/update-homebrew-formula-with-release"
        with:
          binary_name: "cherryctl"
          license: "MPL-2.0"
          release_tag: "${{ github.ref_name }}"
          homebrew_repo_name: "homebrew-${{ github.event.repository.name }}"
          homebrew_repo_owner: "${{ github.repository_owner }}"
          releases_repo_name: "${{ github.event.repository.name }}"
          releases_repo_owner: "${{ github.repository_owner }}"
          pathname_homebrew_formula: "Formula/cherryctl.rb"
          formula_updater_app_client_id: "${{ vars.FORMULA_UPDATER_APP_CLIENT_ID }}"
          secret_formula_updater_app_private_key: "${{ secrets.FORMULA_UPDATER_APP_PRIVKEY }}"
          release_asset_id_checksums_file: ${{ needs.publish-release.outputs.release_asset_id_checksums_file }}
