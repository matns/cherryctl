---
name: "release"

on:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+"

concurrency:
  group: "release"
  cancel-in-progress: false
  queue: "max"

permissions: {}

jobs:
  fact-finding:
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        github.ref_protected == true
      }}
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    outputs:
      finding_go_module: "${{ steps.find-go-module.outputs.go_module }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false

      - name: "Find Go module"
        id: "find-go-module"
        shell: "bash"
        run: |-
          set -euo pipefail

          go_module="$(go list -m)"

          if [[ -z "$go_module" ]]; then
            echo "::error::Go module path is empty"
            exit 1
          fi

          echo "go_module=$go_module" >> "$GITHUB_OUTPUT"

  compile-third-party-licenses:
    permissions:
      contents: "read"
    uses: "$/.github/workflows/release-compile-third-party-licenses.yml"
    with:
      ref: "${{ github.sha }}"

  compile-packages:
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        github.ref_protected == true
      }}
    needs: ["fact-finding", "compile-third-party-licenses"]
    permissions:
      contents: "read"
    uses: "$/.github/workflows/release-compile-packages.yml"
    with:
      repository: "${{ github.repository }}"
      ref: "${{ github.sha }}"
      binary_name: "cherryctl"
      filename_license: "LICENSE.md"
      ld_flags_variable_injectables: >-
        [
          "-X ${{ needs.fact-finding.outputs.finding_go_module }}/cmd.Version=${{ github.ref_name }}"
        ]
      artifact_id_third_party_licenses: "${{ needs.compile-third-party-licenses.outputs.artifact_id_third_party_licenses }}"

  publish-release:
    if: >-
      ${{
         github.event_name == 'push' &&
         github.ref_type == 'tag' &&
         github.ref_protected == true
      }}
    needs: ["compile-packages"]
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
      id-token: "write"
      attestations: "write"
      artifact-metadata: "write"
    outputs:
      release_asset_id_checksums_file: "${{ steps.output-checksums-asset-id.outputs.release_asset_id_checksums_file }}"
    env:
      SOURCE_NAME: "${{ github.event.repository.name }}"
      RELEASE_TAG: "${{ github.ref_name }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false

      - name: "Prepare temporary directories"
        id: "prepare"
        shell: "bash"
        run: |-
          set -euo pipefail

          ROOT_DIR="$(mktemp -d)"
          INPUTS_DIR="${ROOT_DIR}/inputs"
          PACKAGES_DIR="${INPUTS_DIR}/packages"
          SBOMS_DIR="${INPUTS_DIR}/sboms"
          STAGING_DIR="${ROOT_DIR}/staging"
          METADATA_DIR="${ROOT_DIR}/metadata"
          DIST_DIR="${ROOT_DIR}/dist"

          mkdir -p \
            "$PACKAGES_DIR" \
            "$SBOMS_DIR" \
            "$STAGING_DIR" \
            "$METADATA_DIR" \
            "$DIST_DIR"

          FILENAME_CHECKSUMS="${SOURCE_NAME}-${RELEASE_TAG}.sha256sum"
          PATHNAME_CHECKSUMS="${METADATA_DIR}/${FILENAME_CHECKSUMS}"
          PATHNAME_SIGNATURE_BUNDLE="${METADATA_DIR}/${FILENAME_CHECKSUMS}.sigstore.json"

          {
            echo "root_dir=${ROOT_DIR}"
            echo "packages_dir=${PACKAGES_DIR}"
            echo "sboms_dir=${SBOMS_DIR}"
            echo "staging_dir=${STAGING_DIR}"
            echo "metadata_dir=${METADATA_DIR}"
            echo "dist_dir=${DIST_DIR}"
            echo "filename_checksums=${FILENAME_CHECKSUMS}"
            echo "pathname_checksums=${PATHNAME_CHECKSUMS}"
            echo "pathname_signature_bundle=${PATHNAME_SIGNATURE_BUNDLE}"
          } >> "$GITHUB_OUTPUT"

      - name: "Fetch release package artifacts"
        uses: "actions/download-artifact@v8.0.2"
        with:
          pattern: "release-tarballs-${{ github.ref_name }}-*"
          path: "${{ steps.prepare.outputs.packages_dir }}"
          merge-multiple: false

      - name: "Set up Go"
        uses: "actions/setup-go@v6.5.0"
        with:
          go-version-file: "go.mod"
          cache: false

      - name: "Install Syft"
        shell: "bash"
        run: |-
          set -euo pipefail
          go install github.com/anchore/syft/cmd/syft@b254e6d92f28c3868a755f62fb3ca8f26e9fee76

      - name: "Generate source SBOMs"
        shell: "bash"
        env:
          SBOMS_DIR: "${{ steps.prepare.outputs.sboms_dir }}"
        run: |-
          set -euo pipefail

          SYFT="$(go env GOPATH)/bin/syft"
          SBOM_NAME="${SOURCE_NAME}-${RELEASE_TAG}-source"

          "$SYFT" "dir:${GITHUB_WORKSPACE}" \
            --source-name "$SOURCE_NAME" \
            --source-version "$RELEASE_TAG" \
            -o "spdx-json=${SBOMS_DIR}/${SBOM_NAME}.spdx.json"

          "$SYFT" "dir:${GITHUB_WORKSPACE}" \
            --source-name "$SOURCE_NAME" \
            --source-version "$RELEASE_TAG" \
            -o "cyclonedx-json=${SBOMS_DIR}/${SBOM_NAME}.cdx.json"

      - name: "Stage release assets"
        shell: "bash"
        env:
          PACKAGES_DIR: "${{ steps.prepare.outputs.packages_dir }}"
          SBOMS_DIR: "${{ steps.prepare.outputs.sboms_dir }}"
          STAGING_DIR: "${{ steps.prepare.outputs.staging_dir }}"
        run: |-
          set -euo pipefail

          for source_dir in "$PACKAGES_DIR" "$SBOMS_DIR"; do
            if [[ -z "$(find "$source_dir" -type f -print -quit)" ]]; then
              echo "::error::No files found in ${source_dir}"
              exit 1
            fi

            while IFS= read -r -d '' file; do
              destination="${STAGING_DIR}/$(basename "$file")"

              if [[ -e "$destination" ]]; then
                echo "::error::Duplicate release asset: $(basename "$file")"
                exit 1
              fi

              cp -- "$file" "$destination"
            done < <(find "$source_dir" -type f -print0)
          done

          echo "::group::Staged release assets"
          find "$STAGING_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          echo "::endgroup::"

      - name: "Generate release checksums"
        shell: "bash"
        working-directory: "${{ steps.prepare.outputs.staging_dir }}"
        env:
          PATHNAME_CHECKSUMS: "${{ steps.prepare.outputs.pathname_checksums }}"
        run: |-
          set -euo pipefail

          sha256sum -- * > "$PATHNAME_CHECKSUMS"
          sha256sum --check --strict "$PATHNAME_CHECKSUMS"

      - name: "Generate build provenance attestation"
        id: "attest"
        uses: "actions/attest@v4.1.0"
        with:
          subject-checksums: "${{ steps.prepare.outputs.pathname_checksums }}"
          show-summary: true

      - name: "Set up Cosign"
        uses: "sigstore/cosign-installer@v4.1.2"

      - name: "Sign release checksums"
        shell: "bash"
        env:
          PATHNAME_CHECKSUMS: "${{ steps.prepare.outputs.pathname_checksums }}"
          PATHNAME_SIGNATURE_BUNDLE: "${{ steps.prepare.outputs.pathname_signature_bundle }}"
        run: |-
          set -euo pipefail

          cosign sign-blob \
            "$PATHNAME_CHECKSUMS" \
            --bundle "$PATHNAME_SIGNATURE_BUNDLE" \
            --yes

      - name: "Assemble DIST_DIR"
        shell: "bash"
        env:
          STAGING_DIR: "${{ steps.prepare.outputs.staging_dir }}"
          DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
          PATHNAME_CHECKSUMS: "${{ steps.prepare.outputs.pathname_checksums }}"
          PATHNAME_SIGNATURE_BUNDLE: "${{ steps.prepare.outputs.pathname_signature_bundle }}"
          FILENAME_CHECKSUMS: "${{ steps.prepare.outputs.filename_checksums }}"
        run: |-
          set -euo pipefail

          if [[ -n "$(find "$DIST_DIR" -mindepth 1 -print -quit)" ]]; then
            echo "::error::DIST_DIR must be empty before assembly"
            exit 1
          fi

          echo "::group::Assemble release payload"

          cp -- "$STAGING_DIR"/* "$DIST_DIR/"

          echo "::endgroup::"

          echo "::group::Assemble release metadata"

          for file in \
            "$PATHNAME_CHECKSUMS" \
            "$PATHNAME_SIGNATURE_BUNDLE"
          do
            filename="$(basename "$file")"

            if [[ -e "${DIST_DIR}/${filename}" ]]; then
              echo "::error::Duplicate release asset: ${filename}"
              exit 1
            fi

            cp -- "$file" "${DIST_DIR}/${filename}"
          done

          echo "::endgroup::"

          echo "::group::Verify assembled distribution"
          (
            cd "$DIST_DIR"
            sha256sum --check --strict "$FILENAME_CHECKSUMS"
          )

          find "$DIST_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          echo "::endgroup::"


      - name: "Create GitHub release"
        shell: "bash"
        env:
          GH_TOKEN: "${{ github.token }}"
          DIST_DIR: "${{ steps.prepare.outputs.dist_dir }}"
        run: |-
          set -euo pipefail

          gh release create "$RELEASE_TAG" "$DIST_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --verify-tag

      - name: "Get checksums asset ID and output"
        id: "output-checksums-asset-id"
        shell: "bash"
        env:
          GH_TOKEN: "${{ github.token }}"
          FILENAME_CHECKSUMS: "${{ steps.prepare.outputs.filename_checksums }}"
        run: |-
          set -euo pipefail

          asset_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" |
              jq -r --arg filename "$FILENAME_CHECKSUMS" \
                '.assets[] | select(.name == $filename) | .id'
          )"

          if [[ ! "$asset_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Checksum release asset not found: $FILENAME_CHECKSUMS"
            exit 1
          fi

          echo "::notice::Checksums asset ID: ${asset_id}"
          echo "release_asset_id_checksums_file=${asset_id}" >> "$GITHUB_OUTPUT"

  prepare-homebrew-formula:
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        github.ref_protected == true
      }}
    name: "Generate Homebrew Formula"
    needs:
      - "publish-release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository for local action"
        uses: "actions/checkout@v7.0.1"

      - name: "Prepare Homebrew formula"
        uses: "$/.github/actions/prepare-homebrew-formula"
        with:
          binary_name: "cherryctl"
          license: "MPL-2.0"
          release_tag: "${{ github.ref_name }}"
          releases_repo_name: "${{ github.event.repository.name }}"
          releases_repo_owner: "${{ github.repository_owner }}"
          release_asset_id_checksums_file: "${{ needs.publish-release.outputs.release_asset_id_checksums_file }}"

  deploy-homebrew-formula:
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        github.ref_protected == true
      }}
    needs:
      - "prepare-homebrew-formula"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    environment: "publish-homebrew-formula"
    steps:
      - name: "Checkout repository for local action"
        uses: "actions/checkout@v7.0.1"

      - name: "Publish Homebrew formula"
        uses: "$/.github/actions/update-homebrew-tap-with-formula"
        with:
          binary_name: "cherryctl"
          release_tag: "${{ github.ref_name }}"
          homebrew_repo_name: "homebrew-${{ github.event.repository.name }}"
          homebrew_repo_owner: "${{ github.repository_owner }}"
          pathname_homebrew_formula: "Formula/cherryctl.rb"
          formula_updater_app_client_id: "${{ vars.FORMULA_UPDATER_APP_CLIENT_ID }}"
          secret_formula_updater_app_private_key: "${{ secrets.FORMULA_UPDATER_APP_PRIVKEY }}"
