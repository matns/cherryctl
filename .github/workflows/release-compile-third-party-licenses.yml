
---
name: "Release: Compile Third Party Licenses"

on:
  workflow_call:
    outputs:
      artifact_id_third_party_licenses:
        description: "Artifact ID for Third Party Licenses"
        value: "${{ jobs.compile-third-party-licenses.outputs.artifact_id_third_party_licenses }}"
      filename_third_party_licenses:
        description: "Filename of Third Party Licenses"
        value: "${{ jobs.compile-third-party-licenses.outputs.filename_third_party_licenses }}"

permissions: {}

jobs:
  compile-third-party-licenses:
    name: "Compile Third Party Licenses"
    if: "github.ref_type == 'tag'"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    outputs:
      filename_third_party_licenses: "${{ steps.prepare.outputs.filename_third_party_licenses }}"
      artifact_id_third_party_licenses: "${{ steps.upload-third-party-licenses-file.outputs.artifact-id }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Prepare"
        id: "prepare"
        shell: "bash"
        run: |
          DIR=$(mktemp -d)
          FILE_NAME="THIRD_PARTY_LICENSES.txt"

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "filename_third_party_licenses=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: "Set up Go"
        uses: "actions/setup-go@v7.0.0"
        with:
          go-version: "stable"

      - name: "Set up google/go-licenses" # v2.0.1
        shell: "bash"
        run: |
          go install github.com/google/go-licenses/v2@3e084b0caf710f7bfead967567539214f598c0a2

      - name: "Compile"
        id: "compile"
        shell: "bash"
        env:
          DIR: "${{ steps.prepare.outputs.dir }}"
          FILE_NAME: "${{ steps.prepare.outputs.filename_third_party_licenses }}"
        # Generate the third party licenses file. Make go-licenses ignore the module itself, since license of module goes into separate file
        run: |
          "$(go env GOPATH)/bin/go-licenses" report "${{ github.workspace }}/" \
            --ignore="$(go list -m)" \
            --template="${{ github.workspace }}/licenses.tpl" \
            > "$DIR/$FILE_NAME"

          test -s "$DIR/$FILE_NAME"

      - name: "Upload"
        id: "upload"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "third_party_licenses-${{ github.ref_name }}"
          path: "${{ steps.prepare.outputs.dir }}/${{ steps.prepare.outputs.filename_third_party_licenses }}"
          if-no-files-found: "error"
