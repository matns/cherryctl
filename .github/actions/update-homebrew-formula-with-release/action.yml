---
name: "Action: Update Homebrew Formula With Release"
inputs:
  binary_name:
    required: true
    type: "string"
  license:
    required: true
    type: "string"
  release_tag:
    required: true
    type: "string"
  homebrew_repo_name:
    required: true
    type: "string"
  homebrew_repo_owner:
    required: true
    type: "string"
  releases_repo_owner:
    required: true
    type: "string"
  releases_repo_name:
    required: true
    type: "string"
  pathname_homebrew_formula:
    required: true
    description: "Pathname in git repo to the Homebrew formula"
    type: "string"
  formula_updater_app_client_id:
    required: true
    description: "Client ID of the GitHub App authorized to make changes to Homebrew repo"
    type: "string"
  secret_formula_updater_app_private_key:
    required: true
    description: "Private key of the GitHub App authorized to make changes to Homebrew repo"
    type: "string"
  release_asset_id_checksums_file:
    required: true
    description: "Release asset id for release's checksums file"
    type: "string"
runs:
  using: "composite"
  steps:
    - name: "Register secret masking"
      shell: "bash"
      env:
        SECRET_FORMULA_UPDATER_PRIVATE_KEY: ${{ inputs.secret_formula_updater_app_private_key }}
      run: |
        echo "::add-mask::$SECRET_FORMULA_UPDATER_PRIVATE_KEY"

    - name: "Validate inputs"
      shell: bash
      env:
        BINARY_NAME: "${{ inputs.binary_name }}"
        LICENSE: "${{ inputs.license }}"
        RELEASE_TAG: "${{ inputs.release_tag }}"
        HOMEBREW_REPO_NAME: "${{ inputs.homebrew_repo_name }}"
        HOMEBREW_REPO_OWNER: "${{ inputs.homebrew_repo_owner }}"
        RELEASES_REPO_OWNER: "${{ inputs.releases_repo_owner }}"
        RELEASES_REPO_NAME: "${{ inputs.releases_repo_name }}"
        PATHNAME_HOMEBREW_FORMULA: "${{ inputs.pathname_homebrew_formula }}"
        FORMULA_UPDATER_APP_CLIENT_ID: "${{ inputs.formula_updater_app_client_id }}"
        SECRET_FORMULA_UPDATER_APP_PRIVATE_KEY: "${{ inputs.secret_formula_updater_app_private_key }}"
        RELEASE_ASSET_ID_CHECKSUMS_FILE: "${{ inputs.release_asset_id_checksums_file }}"
      run: |
        for name in \
          BINARY_NAME \
          LICENSE \
          RELEASE_TAG \
          HOMEBREW_REPO_NAME \
          HOMEBREW_REPO_OWNER \
          RELEASES_REPO_OWNER \
          RELEASES_REPO_NAME \
          PATHNAME_HOMEBREW_FORMULA \
          FORMULA_UPDATER_APP_CLIENT_ID \
          SECRET_FORMULA_UPDATER_APP_PRIVATE_KEY \
          RELEASE_ASSET_ID_CHECKSUMS_FILE; do
          if [[ -z "${!name-}" ]]; then
            echo "::error::Required input $name is missing or empty"
            exit 1
          fi
        done

    - name: "Resolve Homebrew repository name"
      id: "homebrew-repo"
      shell: "bash"
      env:
        HOMEBREW_REPO_NAME: "${{ inputs.homebrew_repo_name }}"
      run: |
        repo_name="$HOMEBREW_REPO_NAME"
        [[ "$repo_name" == homebrew-* ]] || repo_name="homebrew-${repo_name}"
        echo "name=${repo_name}" >> "$GITHUB_OUTPUT"
        echo "tap=${repo_name#homebrew-}" >> "$GITHUB_OUTPUT"

    - name: "Check if release tag is valid"
      shell: "bash"
      env:
        RELEASE_TAG: "${{ inputs.release_tag }}"
      run: |
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "Invalid release tag: $RELEASE_TAG" >&2
          exit 1
        }

    - name: "Prepare, download release checksums, output checksums pathname"
      id: "prepare-download-output"
      shell: "bash"
      env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_ASSET_ID_CHECKSUMS: "${{ inputs.release_asset_id_checksums_file }}"
        RELEASE_REPO: "${{ inputs.releases_repo_owner }}/${{ inputs.releases_repo_name }}"
      run: |
        dir=$(mktemp -d)

        filename="$(openssl rand -hex 32)"
        pathname_checksums="${dir}/${filename}"

        gh api "repos/${RELEASE_REPO}/releases/assets/${RELEASE_ASSET_ID_CHECKSUMS}" \
          -H "Accept: application/octet-stream" \
          > ${pathname_checksums}

        if [[ ! -s "$pathname_checksums" ]]; then
          echo "::error title=Download failed::Release checksums file is empty"
          exit 1
        fi

        echo "::notice title=Successfully obtained Release Asset::Checksums asset ID: ${RELEASE_ASSET_ID_CHECKSUMS}"

        echo "pathname_checksums=${pathname_checksums}" >> "$GITHUB_OUTPUT"

    - name: "Generate Homebrew formula"
      id: "generate"
      shell: "bash"
      env:
        RELEASE_TAG: "${{ inputs.release_tag }}"
        RELEASES_REPO_OWNER: "${{ inputs.releases_repo_owner }}"
        RELEASES_REPO_NAME: "${{ inputs.releases_repo_name }}"
        BINARY_NAME: "${{ inputs.binary_name }}"
        LICENSE: "${{ inputs.license }}"
      run: |
        set -euo pipefail

        TAG="$RELEASE_TAG"
        VERSION="${TAG#v}"
        PATHNAME_CHECKSUMS="${{ steps.prepare-download-output.outputs.pathname_checksums }}"

        checksum() {
          awk -v file="$1" '
            $2 == file { print $1; found=1; exit }
            END { if (!found) exit 1 }
          ' "${PATHNAME_CHECKSUMS}"
        }

        capitalize() {
          echo "${1^}"
        }

        DARWIN_AMD64=$(checksum "${BINARY_NAME}-${TAG}-darwin-amd64.tar.gz")
        DARWIN_ARM64=$(checksum "${BINARY_NAME}-${TAG}-darwin-arm64.tar.gz")
        LINUX_AMD64=$(checksum "${BINARY_NAME}-${TAG}-linux-amd64-gnu.tar.gz")
        LINUX_ARM64=$(checksum "${BINARY_NAME}-${TAG}-linux-arm64-static.tar.gz")

        dir=$(mktemp -d)
        PATHNAME_FORMULA_FILE="${dir}/${BINARY_NAME}.rb"
        FORMULA_NAME="$(capitalize ${BINARY_NAME})"

        cat > ${PATHNAME_FORMULA_FILE} <<EOF
        # typed: false
        # frozen_string_literal: true

        # This file is automatically generated. DO NOT EDIT.
        class ${FORMULA_NAME} < Formula
          desc "Official Cherry Servers CLI"
          homepage "https://www.cherryservers.com/"
          license "${LICENSE}" # MPL 2.0

          livecheck do
            url :stable
            strategy :github_latest
          end

          on_macos do
            if Hardware::CPU.intel?
              url "https://github.com/${RELEASES_REPO_OWNER}/${RELEASES_REPO_NAME}/releases/download/${TAG}/${BINARY_NAME}-${TAG}-darwin-amd64.tar.gz"
              sha256 "${DARWIN_AMD64}"
            end

            if Hardware::CPU.arm?
              url "https://github.com/${RELEASES_REPO_OWNER}/${RELEASES_REPO_NAME}/releases/download/${TAG}/${BINARY_NAME}-${TAG}-darwin-arm64.tar.gz"
              sha256 "${DARWIN_ARM64}"
            end
          end

          on_linux do
            if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
              url "https://github.com/${RELEASES_REPO_OWNER}/${RELEASES_REPO_NAME}/releases/download/${TAG}/${BINARY_NAME}-${TAG}-linux-amd64-gnu.tar.gz"
              sha256 "${LINUX_AMD64}"
            end

            if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
              url "https://github.com/${RELEASES_REPO_OWNER}/${RELEASES_REPO_NAME}/releases/download/${TAG}/${BINARY_NAME}-${TAG}-linux-arm64-static.tar.gz"
              sha256 "${LINUX_ARM64}"
            end
          end

          def install
            bin.install "${BINARY_NAME}"

            doc.install "LICENSE.md"
            doc.install "SHA256SUMS"
            doc.install "THIRD_PARTY_LICENSES.txt"
          end

          test do
            system "bin/${BINARY_NAME}", "-v"
          end
        end
        EOF

        echo "pathname_formula_file=${PATHNAME_FORMULA_FILE}" >> "${GITHUB_OUTPUT}"
        echo "formula_name=${FORMULA_NAME}" >> "${GITHUB_OUTPUT}"

    - name: "DEBUG: Show rendered formula"
      if: runner.debug == '1'
      shell: bash
      env:
        PATHNAME_FORMULA_FILE: "${{ steps.generate.outputs.pathname_formula_file }}"
      run: |-
        echo "::group::Rendered formula"
        cat "$PATHNAME_FORMULA_FILE"
        echo "::endgroup::"

    - name: "Ensure Brew In Path"
      shell: "bash"
      run: |-
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
        brew --version

    - name: "Generate GitHub App token"
      id: "app-token"
      uses: "actions/create-github-app-token@v3.3.0"
      with:
        client-id: "${{ inputs.formula_updater_app_client_id }}"
        private-key: "${{ inputs.secret_formula_updater_app_private_key }}"
        owner: "${{ inputs.homebrew_repo_owner }}"
        repositories: "${{ steps.homebrew-repo.outputs.name }}"
        permission-contents: "read"
        permission-single-file: "write"

    - name: "Checkout Homebrew repository"
      uses: "actions/checkout@v7.0.1"
      with:
        repository: "${{ inputs.homebrew_repo_owner }}/${{ steps.homebrew-repo.outputs.name }}"
        token: "${{ steps.app-token.outputs.token }}"
        path: "homebrew-tap"
        persist-credentials: false

    - name: "Validate Homebrew Formula File"
      shell: "bash"
      env:
        HOMEBREW_REPO_OWNER: "${{ inputs.homebrew_repo_owner }}"
        HOMEBREW_TAP_NAME: "${{ steps.homebrew-repo.outputs.tap }}"
        PATHNAME_HOMEBREW_FORMULA: "${{ inputs.pathname_homebrew_formula }}"
        PATHNAME_FORMULA_FILE: "${{ steps.generate.outputs.pathname_formula_file }}"
        FORMULA_NAME: "${{ steps.generate.outputs.formula_name }}"
      run: |-
        set -euo pipefail
        test -s "${PATHNAME_FORMULA_FILE}"
        ruby -c "${PATHNAME_FORMULA_FILE}"

        tap="${HOMEBREW_REPO_OWNER}/${HOMEBREW_TAP_NAME}"
        brew tap "${tap}" "${GITHUB_WORKSPACE}/homebrew-tap"

        # brew tap clones committed files; place the newly generated formula in its clone so the audit checks what will actually be published.
        tap_dir="$(brew --repo "${tap}")"
        destination="${tap_dir}/${PATHNAME_HOMEBREW_FORMULA}"
        mkdir -p "$(dirname "${destination}")"
        cp "${PATHNAME_FORMULA_FILE}" "${destination}"

        echo "::debug::Brew audit using formula name: ${FORMULA_NAME}"
        brew trust --tap ${tap}
        brew audit --strict --formula "${tap}/${FORMULA_NAME}"

    - name: "Update Homebrew Repository"
      shell: "bash"
      env:
        GH_TOKEN: "${{ steps.app-token.outputs.token }}"
        HOMEBREW_REPO_OWNER: "${{ inputs.homebrew_repo_owner }}"
        HOMEBREW_REPO: "${{ steps.homebrew-repo.outputs.name }}"
        PATHNAME_HOMEBREW_FORMULA: "${{ inputs.pathname_homebrew_formula }}"
        RELEASE_TAG: "${{ inputs.release_tag }}"
        PATHNAME_TEMPLATED_FORMULA_FILE: "${{ steps.generate.outputs.pathname_formula_file }}"
        BINARY_NAME: "${{ inputs.binary_name }}"
      run: |-
        set -euo pipefail

        repo="$HOMEBREW_REPO_OWNER/$HOMEBREW_REPO"
        SHA=$(gh api \
          "repos/$repo/contents/$PATHNAME_HOMEBREW_FORMULA" \
          --jq '.sha')

        test -s "${PATHNAME_TEMPLATED_FORMULA_FILE}"
        CONTENT=$(base64 -w0 ${PATHNAME_TEMPLATED_FORMULA_FILE})

        gh api \
          --method PUT \
          "repos/$repo/contents/$PATHNAME_HOMEBREW_FORMULA" \
          -f message="chore(homebrew): update ${BINARY_NAME} to $RELEASE_TAG" \
          -f content="$CONTENT" \
          -f sha="$SHA"
