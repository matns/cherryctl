---
name: "Action: Update Homebrew Formula With Release"
inputs:
  binary_name:
    required: true
    type: "string"
  license:
    required: true
    type: "string"
  release_tag:
    required: true
    type: "string"
  homebrew_repo_name:
    required: true
    type: "string"
  homebrew_repo_owner:
    required: true
    type: "string"
  releases_repo_owner:
    required: true
    type: "string"
  releases_repo_name:
    required: true
    type: "string"
  pathname_homebrew_formula:
    required: true
    type: "string"
  formula_updater_app_client_id:
    required: true
    description: "Client ID of the GitHub App authorized to make changes to Homebrew repo"
  secret_formula_updater_app_private_key:
    required: true
    description: "Private key of the GitHub App authorized to make changes to Homebrew repo"
  release_asset_id_checksums_file:
    required: true
    description: "Release asset id for release's checksums file"
runs:
  using: "composite"
  steps:
    - name: "Register secret masking"
      shell: "bash"
      env:
        SECRET_FORMULA_UPDATER_PRIVATE_KEY: ${{ inputs.secret_formula_updater_app_private_key }}
      run: |
        echo "::add-mask::$SECRET_FORMULA_UPDATER_PRIVATE_KEY"

    - name: "Validate inputs"
      shell: bash
      env:
        BINARY_NAME: "${{ inputs.binary_name }}"
        LICENSE: "${{ inputs.license }}"
        RELEASE_TAG: "${{ inputs.release_tag }}"
        HOMEBREW_REPO_NAME: "${{ inputs.homebrew_repo_name }}"
        HOMEBREW_REPO_OWNER: "${{ inputs.homebrew_repo_owner }}"
        RELEASES_REPO_OWNER: "${{ inputs.releases_repo_owner }}"
        RELEASES_REPO_NAME: "${{ inputs.releases_repo_name }}"
        PATHNAME_HOMEBREW_FORMULA: "${{ inputs.pathname_homebrew_formula }}"
        FORMULA_UPDATER_APP_CLIENT_ID: "${{ inputs.formula_updater_app_client_id }}"
        SECRET_FORMULA_UPDATER_APP_PRIVATE_KEY: "${{ inputs.secret_formula_updater_app_private_key }}"
        RELEASE_ASSET_ID_CHECKSUMS_FILE: "${{ inputs.release_asset_id_checksums_file }}"
      run: |
        for name in \
          BINARY_NAME \
          LICENSE \
          RELEASE_TAG \
          HOMEBREW_REPO_NAME \
          HOMEBREW_REPO_OWNER \
          RELEASES_REPO_OWNER \
          RELEASES_REPO_NAME \
          PATHNAME_HOMEBREW_FORMULA \
          FORMULA_UPDATER_APP_CLIENT_ID \
          SECRET_FORMULA_UPDATER_APP_PRIVATE_KEY \
          RELEASE_ASSET_ID_CHECKSUMS_FILE; do
          if [[ -z "${!name-}" ]]; then
            echo "::error::Required input $name is missing or empty"
            exit 1
          fi
        done

    - name: "Check if release tag is valid"
      shell: "bash"
      env:
        RELEASE_TAG: "${{ inputs.release_tag }}"
      run: |
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "Invalid release tag: $RELEASE_TAG" >&2
          exit 1
        }

    - name: "Prepare, download release checksums, output checksums pathname"
      id: "prepare-download-output"
      shell: "bash"
      env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_ASSET_ID_CHECKSUMS: "${{ inputs.release_asset_id_checksums_file }}"
        RELEASE_REPO: "${{ inputs.releases_repo_owner }}/${{ inputs.releases_repo_name }}"
      run: |
        dir=$(mktemp -d)

        filename="$(openssl rand -hex 32)"
        pathname_checksums="${dir}/${filename}"

        gh api "repos/${RELEASE_REPO}/releases/assets/${RELEASE_ASSET_ID_CHECKSUMS}" \
          -H "Accept: application/octet-stream" \
          > ${pathname_checksums}

        if [[ ! -s "$pathname_checksums" ]]; then
          echo "::error title=Download failed::Release checksums file is empty"
          exit 1
        fi

        echo "pathname_checksums="${pathname_checksums}" >> "$GITHUB_OUTPUT

    - name: "Generate Homebrew formula"
      id: "generate"
      shell: "bash"
      env:
        RELEASE_TAG: "${{ inputs.release_tag }}"
      run: |
        set -euo pipefail

        TAG="$RELEASE_TAG"
        VERSION="${TAG#v}"
        PATHNAME_CHECKSUMS="${{ steps.prepare-download-output.outputs.pathname_checksums }}"

        checksum() {
          awk -v file="$1" '
            $2 == file { print $1; found=1; exit }
            END { if (!found) exit 1 }
          ' "${PATHNAME_CHECKSUMS}"
        }

        capitalize() {
          echo "${1^}"
        }

        DARWIN_AMD64=$(checksum "${{ inputs.binary_name }}-${TAG}-darwin-amd64.tar.gz")
        DARWIN_ARM64=$(checksum "${{ inputs.binary_name }}-${TAG}-darwin-arm64.tar.gz")
        LINUX_AMD64=$(checksum "${{ inputs.binary_name }}-${TAG}-linux-amd64-gnu.tar.gz")
        LINUX_ARM64=$(checksum "${{ inputs.binary_name }}-${TAG}-linux-arm64-static.tar.gz")


        dir=$(mktemp -d)
        PATHNAME_FORMULA_FILE="${dir}/${{ inputs.binary_name }}.rb"
        UPPERCASE_BINARY_NAME="$(capitalize ${{ inputs.binary_name }})"
        cat > ${PATHNAME_FORMULA_FILE} <<EOF
        # typed: false
        # frozen_string_literal: true

        # This file is automatically generated. DO NOT EDIT.
        class $UPPERCASE_BINARY_NAME < Formula
          desc "Official Cherry Servers CLI"
          homepage "https://www.cherryservers.com/"
          version "${VERSION}"
          license "${{ inputs.license }}" # MPL 2.0

          livecheck do
            url "https://github.com/${{ inputs.releases_repo_owner }}/${{ inputs.releases_repo_name }}"
            strategy :github_latest
          end

          on_macos do
            if Hardware::CPU.intel?
              url "https://github.com/${{ inputs.releases_repo_owner }}/${{ inputs.releases_repo_name }}/releases/download/${TAG}/${{ inputs.binary_name }}-${TAG}-darwin-amd64.tar.gz"
              sha256 "${DARWIN_AMD64}"
            end

            if Hardware::CPU.arm?
              url "https://github.com/${{ inputs.releases_repo_owner }}/${{ inputs.releases_repo_name }}/releases/download/${TAG}/${{ inputs.binary_name }}-${TAG}-darwin-arm64.tar.gz"
              sha256 "${DARWIN_ARM64}"
            end
          end

          on_linux do
            if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
              url "https://github.com/${{ inputs.releases_repo_owner }}/${{ inputs.releases_repo_name }}/releases/download/${TAG}/${{ inputs.binary_name }}-${TAG}-linux-amd64-gnu.tar.gz"
              sha256 "${LINUX_AMD64}"
            end

            if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
              url "https://github.com/${{ inputs.releases_repo_owner }}/${{ inputs.releases_repo_name }}/releases/download/${TAG}/${{ inputs.binary_name }}-${TAG}-linux-arm64-static.tar.gz"
              sha256 "${LINUX_ARM64}"
            end
          end

          def install
            bin.install "${{ inputs.binary_name }}"

            doc.install "LICENSE.md"
            doc.install "SHA256SUMS"
            doc.install "THIRD_PARTY_LICENSES.txt"
          end

          test do
            system "#{bin}/${{ inputs.binary_name }}", "-v"
          end
        end
        EOF

        ruby -c "${PATHNAME_FORMULA_FILE}"
        test -s "${PATHNAME_FORMULA_FILE}"

        echo "pathname_formula_file=${PATHNAME_FORMULA_FILE}" >> "$GITHUB_OUTPUT"

    - name: "Generate GitHub App token"
      id: "app-token"
      uses: "actions/create-github-app-token@v3.3.0"
      with:
        client-id: "${{ inputs.formula_updater_app_client_id }}"
        private-key: "${{ inputs.secret_formula_updater_app_private_key }}"
        owner: "${{ inputs.homebrew_repo_owner }}"
        repositories: "${{ inputs.homebrew_repo_name }}"
        permission-single-file: "write"

    - name: "Update Homebrew Repository"
      shell: "bash"
      env:
        GH_TOKEN: "${{ steps.app-token.outputs.token }}"
        HOMEBREW_REPO_OWNER: "${{ inputs.homebrew_repo_owner }}"
        HOMEBREW_REPO: "${{ inputs.homebrew_repo_name }}"
        PATHNAME_HOMEBREW_FORMULA: "${{ inputs.pathname_homebrew_formula }}"
        RELEASE_TAG: "${{ inputs.release_tag }}"
        PATHNAME_FORMULA_FILE: "${{ steps.generate.outputs.pathname_formula_file }}"
        BINARY_NAME: "${{ inputs.binary_name }}"
      run: |-
        set -euo pipefail
        test -s "${PATHNAME_HOMEBREW_FORMULA}"

        REPO="$HOMEBREW_REPO_OWNER/$HOMEBREW_REPO"
        SHA=$(gh api \
          "repos/$REPO/contents/$PATHNAME_HOMEBREW_FORMULA" \
          --jq '.sha')

        CONTENT=$(base64 -w0 ${PATHNAME_FORMULA_FILE})

        gh api \
          --method PUT \
          "repos/$REPO/contents/$PATHNAME_HOMEBREW_FORMULA" \
          -f message="chore(homebrew): update ${BINARY_NAME} to $RELEASE_TAG" \
          -f content="$CONTENT" \
          -f sha="$SHA"
