# This composite action generates and tests a Homebrew formula from a release.
# It uses the calling workflow's environment and never checks out a tap repository.
---
name: "Action: Prepare and Test Homebrew Formula"
inputs:
  binary_name:
    required: true
  license:
    required: true
  release_tag:
    required: true
  releases_repo_owner:
    required: true
  releases_repo_name:
    required: true
  release_asset_id_checksums_file:
    required: true
    description: "Release asset id for release's checksums file"
runs:
  using: "composite"
  steps:

    - name: "Verify tag push trigger"
      # Reject:
      # (1) bad events (workflow_dispatch, release, pull_request)
      # (2) non tag ref types
      # (3) deleted tags
      # (4) ensure pushed tag matches input tag provided to action
      shell: "bash"
      env:
        EVENT_NAME: "${{ github.event_name }}"
        REF_TYPE: "${{ github.ref_type }}"
        REF: "${{ github.ref }}"
        DELETED: "${{ github.event.deleted }}"
        RELEASE_TAG: "${{ inputs.release_tag }}"
      run: |-
        set -euo pipefail
        if [[ "$EVENT_NAME" != "push" || "$REF_TYPE" != "tag" || "$DELETED" == "true" || "$REF" != "refs/tags/$RELEASE_TAG" ]]; then
          echo "::error::Action requires a push to the specified release tag (check if conditions)"
          exit 1
        fi
    - name: "Validate inputs"
      shell: bash
      env:
        BINARY_NAME: "${{ inputs.binary_name }}"
        LICENSE: "${{ inputs.license }}"
        RELEASE_TAG: "${{ inputs.release_tag }}"
        RELEASES_REPO_OWNER: "${{ inputs.releases_repo_owner }}"
        RELEASES_REPO_NAME: "${{ inputs.releases_repo_name }}"
        RELEASE_ASSET_ID_CHECKSUMS_FILE: "${{ inputs.release_asset_id_checksums_file }}"
      run: |
        for name in \
          BINARY_NAME \
          LICENSE \
          RELEASE_TAG \
          RELEASES_REPO_OWNER \
          RELEASES_REPO_NAME \
          RELEASE_ASSET_ID_CHECKSUMS_FILE; do
          if [[ -z "${!name-}" ]]; then
            echo "::error::Required input $name is missing or empty"
            exit 1
          fi
        done

    - name: "Check if release tag is valid"
      shell: "bash"
      env:
        RELEASE_TAG: "${{ inputs.release_tag }}"
      run: |
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "Invalid release tag: $RELEASE_TAG" >&2
          exit 1
        }

    - name: "Prepare, download release checksums, output checksums pathname"
      id: "prepare-download-output"
      shell: "bash"
      env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_ASSET_ID_CHECKSUMS: "${{ inputs.release_asset_id_checksums_file }}"
        RELEASE_REPO: "${{ inputs.releases_repo_owner }}/${{ inputs.releases_repo_name }}"
      run: |
        dir=$(mktemp -d "${GITHUB_WORKSPACE}/temp.XXXXXXXXX")
        echo "::debug::dir: ${dir}"

        pathname_checksums="${dir}/$(openssl rand -hex 32)"
        gh api "repos/${RELEASE_REPO}/releases/assets/${RELEASE_ASSET_ID_CHECKSUMS}" \
          -H "Accept: application/octet-stream" \
          > "${pathname_checksums}"

        if [[ ! -s "$pathname_checksums" ]]; then
          echo "::error title=Download failed::Release checksums file is empty"
          exit 1
        fi

        echo "::notice title=Successfully obtained Release Asset::Checksums asset ID: ${RELEASE_ASSET_ID_CHECKSUMS}"

        echo "pathname_checksums=${pathname_checksums}" >> "$GITHUB_OUTPUT"

    - name: "Generate Homebrew formula"
      id: "generate"
      shell: "bash"
      env:
        RELEASE_TAG: "${{ inputs.release_tag }}"
        RELEASES_REPO_OWNER: "${{ inputs.releases_repo_owner }}"
        RELEASES_REPO_NAME: "${{ inputs.releases_repo_name }}"
        BINARY_NAME: "${{ inputs.binary_name }}"
        LICENSE: "${{ inputs.license }}"
      run: |
        set -euo pipefail

        TAG="$RELEASE_TAG"
        PATHNAME_CHECKSUMS="${{ steps.prepare-download-output.outputs.pathname_checksums }}"

        checksum() {
          awk -v file="$1" '
            $2 == file { print $1; found=1; exit }
            END { if (!found) exit 1 }
          ' "${PATHNAME_CHECKSUMS}"
        }

        capitalize() {
          echo "${1^}"
        }

        DARWIN_AMD64=$(checksum "${BINARY_NAME}-${TAG}-darwin-amd64.tar.gz")
        DARWIN_ARM64=$(checksum "${BINARY_NAME}-${TAG}-darwin-arm64.tar.gz")
        LINUX_AMD64=$(checksum "${BINARY_NAME}-${TAG}-linux-amd64-gnu.tar.gz")
        LINUX_ARM64=$(checksum "${BINARY_NAME}-${TAG}-linux-arm64-static.tar.gz")

        dir=$(mktemp -d "${GITHUB_WORKSPACE}/temp.XXXXXXXXX")
        PATHNAME_FORMULA_FILE="${dir}/${BINARY_NAME}.rb"
        FORMULA_NAME="$(capitalize ${BINARY_NAME})"

        cat > "${PATHNAME_FORMULA_FILE}" <<EOF
        # typed: false
        # frozen_string_literal: true

        # This file is automatically generated. DO NOT EDIT.
        class ${FORMULA_NAME} < Formula
          desc "Official Cherry Servers CLI"
          homepage "https://www.cherryservers.com/"
          license "${LICENSE}" # MPL 2.0

          livecheck do
            url :stable
            strategy :github_latest
          end

          on_macos do
            if Hardware::CPU.intel?
              url "https://github.com/${RELEASES_REPO_OWNER}/${RELEASES_REPO_NAME}/releases/download/${TAG}/${BINARY_NAME}-${TAG}-darwin-amd64.tar.gz"
              sha256 "${DARWIN_AMD64}"
            end

            if Hardware::CPU.arm?
              url "https://github.com/${RELEASES_REPO_OWNER}/${RELEASES_REPO_NAME}/releases/download/${TAG}/${BINARY_NAME}-${TAG}-darwin-arm64.tar.gz"
              sha256 "${DARWIN_ARM64}"
            end
          end

          on_linux do
            if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
              url "https://github.com/${RELEASES_REPO_OWNER}/${RELEASES_REPO_NAME}/releases/download/${TAG}/${BINARY_NAME}-${TAG}-linux-amd64-gnu.tar.gz"
              sha256 "${LINUX_AMD64}"
            end

            if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
              url "https://github.com/${RELEASES_REPO_OWNER}/${RELEASES_REPO_NAME}/releases/download/${TAG}/${BINARY_NAME}-${TAG}-linux-arm64-static.tar.gz"
              sha256 "${LINUX_ARM64}"
            end
          end

          def install
            bin.install "${BINARY_NAME}"

            doc.install "LICENSE.md"
            doc.install "SHA256SUMS"
            doc.install "THIRD_PARTY_LICENSES.txt"
          end

          test do
            assert_match version.to_s, shell_output("#{bin}/${BINARY_NAME} -v")
          end
        end
        EOF

        echo "pathname_formula_file=${PATHNAME_FORMULA_FILE}" >> "${GITHUB_OUTPUT}"

    - name: "DEBUG: Show rendered formula"
      if: runner.debug == '1'
      shell: bash
      env:
        PATHNAME_FORMULA_FILE: "${{ steps.generate.outputs.pathname_formula_file }}"
      run: |-
        echo "::group::Rendered formula"
        cat "$PATHNAME_FORMULA_FILE"
        echo "::endgroup::"

    - name: "Check if formula exists"
      shell: "bash"
      env:
        PATHNAME_FORMULA_FILE: "${{ steps.generate.outputs.pathname_formula_file }}"
      run: |-
        test -s "${PATHNAME_FORMULA_FILE}"

    - name: "Check if formula is valid Ruby"
      uses: geomys/sandboxed-step@v1.2.2
      with:
         rootfs-image: "ruby:3.4-slim-bookworm@sha256:a0636a941ef86063f17b343f6c96f271f8eeedd76febf035bb6d57bc5024682b"
         disable-network: "true"
         env: |-
           PATHNAME_FORMULA_FILE=${{ steps.generate.outputs.pathname_formula_file }}
         run: |-
           if ruby -c "${PATHNAME_FORMULA_FILE}"; then
             echo "::notice::Ruby syntax validation passed"
           else
             echo "::error::Ruby syntax validation failed: ${PATHNAME_FORMULA_FILE}"
             exit 1
           fi

    - name: "Ensure Brew In Path"
      shell: "bash"
      run: |-
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
        brew --version

    - name: "Install and test generated Homebrew formula locally"
      shell: "bash"
      env:
        HOMEBREW_DEVELOPER: "1"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        PATHNAME_FORMULA_FILE: "${{ steps.generate.outputs.pathname_formula_file }}"
      run: |-
        set -euo pipefail
        # Install from the generated local file, not from a Homebrew tap.
        brew install --formula "${PATHNAME_FORMULA_FILE}"
        brew test "${PATHNAME_FORMULA_FILE}"

    - name: "Upload Formula File"
      id: "upload-formula"
      uses: "actions/upload-artifact@v7.0.2"
      with:
        name: "homebrew-formula-${{ inputs.binary_name }}-${{ github.sha }}"
        path: "${{ steps.generate.outputs.pathname_formula_file }}"
        archive: true
        overwrite: true
        if-no-files-found: "error"
